[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgytdlp"
version = "0.1.0"
description = "Rewrite of the Telegram download bot"
requires-python = ">=3.11"
dependencies = [
    "pyrotgfork",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tgytdlp = "tgytdlp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
